name: test

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      stress:
        description: Include multiprocess contention stress tests
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: Verify Windows SDK ABI
        if: runner.os == 'Windows'
        run: uv run pytest tests/filesystem_ops/test_windows_abi.py -q
      - run: uv run pytest -q --slow-recovery ${{ inputs.stress && '--stress-locks' || '' }}
      - run: uv run mypy src
      - run: uv build
